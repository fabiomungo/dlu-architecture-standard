  # EKG v1.1 relationships (RFC-0002; EKG-Ontology-1.0.md §5, 49 rows in the
  # source table — corrected here from an earlier "48" miscount, found while
  # transcribing the same table into the Postgres Ontology Registry seed,
  # backend/scripts/seed_ekg_ontology_v1.py, EKG-W0-01, dlu_builder_tk).
