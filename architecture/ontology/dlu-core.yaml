# DLU-Core Ontology Registry (L1) — DAS BOOK-05 Ch. 8 · seeded at STX-05
# Machine-readable single source of truth for classes, graph labels and the
# closed relationship registry (BOOK-05 §3.2, §5.3). Consumed by
# scripts/ci/lint_ontology.py in both repos. New classes/relationships
# require an RFC amending BOOK-05 FIRST, then this file.
version: "2.0"
source: "BOOK-05 v1.0 §3.2, §5.3; BOOK-13 Ch. 3"
# EKG-W0-01 (RFC-0002 §7): the EKG classes/relationships below are also
# registered as live, queryable rows in a versioned Postgres Ontology
# Registry (`platform.ekg_ontology_versions/ekg_node_types/ekg_edge_types/
# ekg_shacl_shapes`, `dlu_builder_tk/backend/database/models_ekg.py`) —
# this YAML is the narrative/governance record (BOOK-05 Ch. 8: "this Book
# is its narrative; the YAML is what CI reads"), the Postgres registry is
# what projection/mastery/mapping/Lens services resolve against at
# runtime. Current published registry version: 1.0.0 (37 node types, 49
# edge types, 3 SHACL shapes — seeded verbatim from EKG-Ontology-1.0.md
# §4-5 by `backend/scripts/seed_ekg_ontology_v1.py`; immutable once
# approved, a new registry version is a new semver row, never a rewrite).

