  # semantics under a different name: HAS_COURSE (Program->Course, ==
  # INCLUDES_COURSE), HAS_MODULE (Course->Module, == CONTAINS), HAS_LESSON
  # (Module->Lesson, == the existing HAS_LESSON row verbatim), TEACHES
  # (Lesson->Concept, == COVERS), PREREQUISITE_OF (Concept->Concept, ==
  # canonical PREREQUISITE_FOR), ASSESSED_BY (Outcome->Assessment, == the
  # existing ASSESSES row's inverse direction). Everything below is a
  # genuinely new pair — three of them (DEVELOPS, ASSESSES, EVIDENCES) are a
  # SECOND domain/range pair under an already-used name: valid in a property
  # graph (one relationship type, multiple label pairs), disambiguated below
  # by domain/range rather than renamed, same pattern ASSESSES's own combined
  # range string already uses.
