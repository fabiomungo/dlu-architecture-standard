  # RFC-0001 (BOOK-22 v0.5, FW6-01..FW6-10) — new event-type noun prefixes.
  # `faculty` was ALREADY an unregistered prefix before this program
  # (FACULTY_REGISTERED/FACULTY_DOCUMENT_VERIFIED/FACULTY_ACTIVATED, SPRINT-08)
  # — closed here since FW6-03 (FACULTY_QUALIFIED/FACULTY_QUALIFICATION_WAIVED)
  # extends the same noun. Several OTHER pre-existing unregistered prefixes
  # (offer, orientation, period, variance, workload, teaching_assignment,
  # eligibility, board_resolution, ava, faculty_document, governance_action)
  # were found in the same audit but are out of this program's scope — none
  # of RFC-0001's own event types use them; left for a dedicated ontology
  # sync pass.
  - faculty
  - catalog_course
  - deliverable
  - deadline
  - federation_agreement
  - federated_faculty
  - assignment_order
  - supplier_invoice
  # EKG-W0-03 (event backbone foundation) — extends `backend/services/
  # event_taxonomy.py` (dlu_builder_tk) with 5 new event types feeding the
  # future Graph Projection consumer (EKG-W0-04). Two reuse the `career`/
  # `mapping` nouns RFC-0002 already registered above (career.target_changed,
  # mapping.assertion_reviewed); these three are genuinely new prefixes:
  # outcome (CLO/MLO/ILO/PLO change signal — no outcome-level domain event
  # existed before, only course.* did), resource (LearningResource alignment,
  # EKG-Ontology-1.0.md §16's own suggested event list), mastery_observation
  # (the new immutable raw-observation event, distinct from the existing
  # `mastery` noun's computed-state `mastery.updated`).
  - outcome
  - resource
  - mastery_observation
  # RFC-0002 (EKG-W6, ATA 1.0 + EKG v1.1 persona/RKG-governance integration).
  # `mastery`/`recommendation`/`path`/`policy` already registered above cover
  # part of EKG-Ontology-1.0.md §16's event list (mastery.observation.created,
  # recommendation.generated); these are the genuinely new prefixes: tutor
  # (dlu.tutor.* — ADR-0018), goal/intervention (ATA), mapping (mapping.
  # assertion.reviewed — RKG-maintenance stewardship, ADR-0021), career/gap
  # (career.target.changed, EKG career layer), ontology (Ontology Registry
  # version changes, the RKG-maintenance write path itself).
  - tutor
  - goal
  - intervention
  - mapping
  - career
  - gap
  - ontology
  # EKG-W1-02 (RFC-0002 §7, ADR-0022 — Institution/School/Program academic
  # hierarchy projection). Course itself reuses the pre-existing `course`
  # noun (COURSE_CREATED/COURSE_UPDATED, registered since before EKG but
  # never actually emitted until this sprint) rather than minting a
  # redundant fourth prefix.
  - institution
  - school
  - program
  # EKG-W1-03 (RFC-0002 §7 — Knowledge projection: Concept nodes +
  # PREREQUISITE_OF/RELATED_TO/PART_OF edges). Note: the "Wave 3 Knowledge
  # Graph" that actually sources these projections is a pre-existing,
  # course-scoped, generic (non-EKG) Postgres system predating this
  # program (`KnowledgeGraphNode`/`KnowledgeGraphEdge`, `models.py`) — only
  # its `node_type == CONCEPT` rows and `RELATED_TO`/`PREREQUISITE`/
  # `PART_OF` edge types map onto the EKG Ontology's `Concept` node type;
  # its other node/edge types (Topic, Skill, Person, ... / EXAMPLE_OF,
  # SIMILAR_TO, ...) have no EKG analog and are not projected.
  - concept
