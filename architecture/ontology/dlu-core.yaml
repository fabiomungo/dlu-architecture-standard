  # EKG v1.1 — Educational Knowledge Graph ontology (RFC-0002, ADR-0019/0021;
  # source: DLU_EKG_Suite/DKA/100-ontology/EKG-Ontology-1.0.md §4). Only
  # classes with no existing equivalent below are added; overlaps are noted
  # in place rather than duplicated (this file's own header rule — RFC first).
  # NOT duplicated here: Institution/School/Program/Course/Module/Lesson/
  # Concept/Skill/CLO/MLO/Assessment/Credential/Agent/Recommendation already
  # exist above; LearningOutcome == the existing Outcome class (already
  # annotated "subsumed"); Evidence == the existing EvidenceRecord class.
  - {name: LearningResource, graph_label: LearningResource, engine: learning,
     notes: "EKG-native superclass; the existing CourseResource/MediaAsset
             pair stays as-is (v1.0 legacy), not merged into this"}
  - {name: KnowledgeUnit, graph_label: KnowledgeUnit, engine: knowledge}
  - {name: ToolTechnology, graph_label: ToolTechnology, engine: knowledge}
  - {name: Dataset, graph_label: Dataset, engine: knowledge}
  - {name: FrameworkConcept, graph_label: FrameworkConcept, engine: competency,
     notes: "external framework concept wrapper (CASE/ESCO/SFIA/DigComp/EQF/
             Bloom), pinned version; linked only via MappingAssertion"}
  - {name: QualificationLevel, graph_label: QualificationLevel, engine: competency}
  - {name: AssessmentItem, graph_label: AssessmentItem, engine: assessment}
  - {name: Rubric, graph_label: Rubric, engine: assessment}
  - {name: RubricCriterion, graph_label: RubricCriterion, engine: assessment}
  - {name: PerformanceLevel, graph_label: PerformanceLevel, engine: assessment}
  - {name: MasteryObservation, graph_label: MasteryObservation, engine: knowledge,
     notes: "immutable temporal observation (score, confidence, observedAt,
             sourceType, algorithmVersion); replaces the collapsed
             mastery_events single value — mastery != confidence, always
             (EKG usage/RKG-maintenance plane: ADR-0021)"}
  - {name: LearningState, graph_label: LearningState, engine: knowledge,
     notes: "materialized snapshot over MasteryObservation; replaces
             concept_mastery's single-value posture"}
  - {name: JobRole, graph_label: JobRole, engine: gps}
  - {name: CareerPath, graph_label: CareerPath, engine: gps}
  - {name: SkillRequirement, graph_label: SkillRequirement, engine: gps,
     notes: "reifies the role-skill relation so level/importance/validity/
             source are auditable (EKG-Ontology-1.0.md §11)"}
  - {name: GapObservation, graph_label: GapObservation, engine: gps}
  - {name: LearningPath, graph_label: LearningPath, engine: gps,
     notes: "GPS output artefact (DAS_EKG_INTEGRATION_PLAN.md engine-name
             reconciliation: GPS is canonical, Learning Path is what it
             emits); distinct from the existing PathScenario (a what-if
             simulation, never committed) and LearningMission"}
  - {name: LearningPathStep, graph_label: LearningPathStep, engine: gps}
  - {name: PolicyRule, graph_label: PolicyRule, engine: platform,
     notes: "machine-readable governance/validation rule (graph invariants,
             mapping-review rules); distinct from ATA's PolicyVersion below
             (a versioned pedagogical policy, not a graph-invariant rule) —
             both are RKG-maintenance objects (ADR-0021)"}
  - {name: MappingAssertion, graph_label: MappingAssertion, engine: competency,
     notes: "governed mapping (type exact/close/broad/narrow/related,
             confidence, reviewer, status); replaces uncontrolled sameAs —
             the primary RKG-maintenance object stewards act on (ADR-0021,
             BOOK-19 §1.1 persona RACI)"}

  # ATA 1.0 — Adaptive Tutor graph extension (11 nodes/12 edges; RFC-0002,
  # ADR-0016/0018; source: MASTERBOOK-UPDATE-EKG-ATA-COURSEv2.md §1,
  # DLU_EKG_Suite/DKA/600-adaptive-tutor/ATA-EKG-Extension.md). Recommendation
  # is reused, not re-added — the ATA doc's own "11 nodes" count includes it.
  - {name: LearningGoal, graph_label: LearningGoal, engine: ace}
  - {name: LearningIntervention, graph_label: LearningIntervention, engine: ace}
  - {name: LearningStrategy, graph_label: LearningStrategy, engine: ace}
