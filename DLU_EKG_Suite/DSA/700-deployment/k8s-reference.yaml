apiVersion: v1
kind: Namespace
metadata: {name: dlu-ekg}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ekg-api, namespace: dlu-ekg}
spec:
  replicas: 3
  selector: {matchLabels: {app: ekg-api}}
  template:
    metadata: {labels: {app: ekg-api}}
    spec:
      containers:
        - name: api
          image: registry.dlu.example/ekg-api:1.1.0
          ports: [{containerPort: 8080}]
          env:
            - {name: NEO4J_URI, valueFrom: {secretKeyRef: {name: ekg-secrets, key: neo4j-uri}}}
            - {name: KAFKA_BOOTSTRAP_SERVERS, valueFrom: {configMapKeyRef: {name: ekg-config, key: kafka-bootstrap}}}
          readinessProbe: {httpGet: {path: /health/ready, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: 8080}, initialDelaySeconds: 20, periodSeconds: 20}
          resources: {requests: {cpu: "500m", memory: "1Gi"}, limits: {cpu: "2", memory: "4Gi"}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: ekg-api, namespace: dlu-ekg}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ekg-api}
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
