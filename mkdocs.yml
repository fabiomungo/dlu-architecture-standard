site_name: DLU Architecture Standard
site_description: Reference architecture for the DLU AI-Native University
site_author: DLU Architecture Board
repo_name: dlu-architecture-standard

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Home: index.md
  - Masterbook:
      - Index & Reading Paths: masterbook/MASTERBOOK-INDEX.md
      - "BOOK-00 — Vision & Manifesto (v2.0)": masterbook/BOOK-00-Executive-Vision-and-Manifesto-v2.0.md
      - "BOOK-01 — Academic Philosophy": masterbook/BOOK-01-Academic-Philosophy-and-Pedagogical-Model-v1.0.md
      - "BOOK-02 — AI-Native University Theory": masterbook/BOOK-02-AI-Native-University-Theory-v1.0.md
      - "BOOK-03 — Academic Operating System": masterbook/BOOK-03-Academic-Operating-System-v1.0.md
      - "BOOK-04 — Academic Domain Model": masterbook/BOOK-04-Academic-Domain-Model-v1.0.md
      - "BOOK-05 — Ontology & Semantic Model": masterbook/BOOK-05-Academic-Ontology-and-Semantic-Model-v1.0.md
      - "BOOK-06 — Student Digital Twin": masterbook/BOOK-06-Student-Digital-Twin-v1.0.md
      - "BOOK-07 — Faculty Digital Twin": masterbook/BOOK-07-Faculty-Digital-Twin-v1.0.md
      - "BOOK-08 — Institution Digital Twin": masterbook/BOOK-08-Institution-Digital-Twin-v1.0.md
      - "BOOK-09 — Academic Cognitive Engine": masterbook/BOOK-09-Academic-Cognitive-Engine-v1.0.md
      - "BOOK-10 — AI Workforce": masterbook/BOOK-10-AI-Workforce-v1.0.md
      - "BOOK-10A — Workforce, Skills & MCP Catalog": masterbook/BOOK-10A-AI-Workforce-Skills-and-MCP-Catalog-v1.0.md
      - "BOOK-10B — AI Execution Framework": masterbook/BOOK-10B-AI-Execution-Framework-v1.0.md
      - "BOOK-11 — AI Cognitive Architecture": masterbook/BOOK-11-AI-Cognitive-Architecture-v1.0.md
      - "BOOK-12 — Memory Architecture": masterbook/BOOK-12-Memory-Architecture-v1.0.md
      - "BOOK-13 — Academic Knowledge Network": masterbook/BOOK-13-Academic-Knowledge-Network-v1.0.md
